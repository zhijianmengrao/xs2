name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 7 个测试文件（插件注册/市场/桌面打包/章节删除/story assistant 等）按本地开发
      # 布局读取主仓库旁的 ../DeterminFlow-Plugins（见 tests/ 内 parents[2] 引用），
      # CI 需复现该兄弟布局，否则收集阶段 FileNotFoundError。
      - name: Checkout sibling plugins repo (dev layout ../DeterminFlow-Plugins)
        run: git clone --depth 1 https://github.com/zhijianmengrao/xs2-plugins "${{ github.workspace }}/../DeterminFlow-Plugins"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      # 供应商失败率闸门自检（R46）：R45 把「无样本空转」做成退出码 3，但闸门
      # 本身仍无任何自动使用者（HANDOVER_ROUND45 §2.4）。本步用入库的真实形状
      # fixture 把三种退出码都真实走一遍——证明闸门在 CI 上真的判、且「没判到
      # 东西」会自己发出声音，而不是每步都绿却零样本。
      #
      # 注意判据边界：fixture 是**固定**数据，所以本步保护的是「闸门与脚本行为
      # 不退化」，不是「供应商今天健康」。真实数据的失败率判定需要 run 记录进
      # CI（artifact 聚合或入库数据面），尚未接线（R46 §未做）。
      - name: Provider failure-rate gate self-test (fixture)
        env:
          # fixture 落在 tests/fixtures/run_samples/workflows/，DATA_DIR 指到其
          # 上一层即可让 src.config.WORKFLOWS_DIR 正好命中（src/config.py:21）。
          DETERMINFLOW_DATA_DIR: ${{ github.workspace }}/tests/fixtures/run_samples
        run: |
          run_gate() {
            python scripts/provider_failure_profile.py --limit 100 --require-sample "$@"
          }
          # 断言退出码；不符则带上下文报错（CI 日志里直接看到 gate 的 stderr）
          expect_exit() {
            want=$1; label=$2; errfile=$3; shift 3
            code=0
            "$@" > /dev/null 2> "$errfile" || code=$?
            cat "$errfile"
            if [ "$code" -ne "$want" ]; then
              echo "::error::$label 期望退出码 $want，实际 $code"
              exit 1
            fi
            echo "OK  $label  exit=$code"
          }

          # 基线 60 次尝试 / 7 失败 / 11.67%：阈值 15 应通过
          expect_exit 0 "阈值 15 未超阈" gate-ok.err run_gate --fail-if-above 15 --summary
          # 阈值 1 应触发——证明闸门不是恒真
          expect_exit 1 "阈值 1 触发闸门" gate-breach.err run_gate --fail-if-above 1 --summary
          # 空数据 + --require-sample 应为 3——证明「闸门没生效」会显式失败
          mkdir -p empty-data/workflows
          expect_exit 3 "无样本时闸门显式失败" gate-nosample.err \
            env DETERMINFLOW_DATA_DIR="$PWD/empty-data" \
            python scripts/provider_failure_profile.py --limit 100 --require-sample \
            --fail-if-above 15 --summary

      # 真实数据面（R47）：上一步的 fixture 是**固定**样本，只能证明「闸门与
      # 脚本不退化」，判不了「这批 run 的真实失败率」（HANDOVER_ROUND46 §2.1
      # 的判据边界）。本步判入库的真实快照 tests/fixtures/live_snapshot ——
      # 从本机真实 run 记录裁剪而来，带 snapshot-meta.json 记录导出时的数字。
      #
      # 为什么不是「又一个恒绿」：阈值由快照自身实测失败率 + 余量算出，且脚本
      # 先校验「元数据与内容复算一致」——内容变了而没重导元数据会以退出码 4
      # 失败。退出码语义与 R45/R46 的闸门一致：0 通过 / 1 超阈 / 3 无样本。
      # 真实失败率闸门（R47 接、R57 修）。R47 的原写法是「阈值 = 实测 + 余量」，
      # 判据又是「实测 > 阈值」——而余量禁止为负，于是阈值恒 ≥ 实测，**任何数据
      # 都判不出超阈**（R57 实测：20 次尝试全失败仍判退出 0）。R57 把阈值移出被
      # 测量的量：这里给一个写明数字的政策上限，判据用 95% 区间下界（整个区间都
      # 在上限之上才红）。取 8% 的依据：入库快照 10/255 = 3.92%，区间
      # [2.14%, 6.56%] 明确在限内；要判红需要 255 次尝试里至少 29 次失败（11.4%）。
      # R61 校准（docs/failure-ceiling-calibration.md）：normal 的实际门槛是
      # k≤13（5.10%）、14~28 判不了、k≥29（11.37%）才判超阈——8% 是突破线
      # 不是健康线。维持 8% 的依据：全历史 16/297 的 95% 上界 8.07%，且 7%
      # 会让政策带与回归带在 n=255 下逐 k 重合。
      # 上限是政策值，不随快照漂移；改它必须同时改这里与 windows 那段（有测试钉住）。
      #
      # 反向验证压到 1%：区间下界 2.14% 高于它必须判 1。没有这一步，「上限写得
      # 比谁都高」同样恒绿，而日志里看不出它从不说话。
      - name: Provider failure-rate gate against real snapshot
        env:
          DETERMINFLOW_DATA_DIR: ${{ github.workspace }}/tests/fixtures/live_snapshot
        run: |
          # 先跑闸门再解释退出码；不能靠 `set -e` 抢走退出码（$? 会是 0）。
          code=0
          python scripts/check_live_snapshot_gate.py --fail-if-above 8 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::真实失败率闸门判 $code（1=超 8% 上限 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit "$code"
          fi
          tight=0
          python scripts/check_live_snapshot_gate.py --fail-if-above 1 || tight=$?
          if [ "$tight" -ne 1 ]; then
            echo "::error::上限压到 1% 后仍判 $tight（期望 1）：闸门没有判定力"
            exit 1
          fi
          echo "OK  真实失败率闸门双向生效：8% 上限通过，1% 上限触发 1"

      # 历史基线回归（R59）：上一步判的是**绝对**失败率是否越过政策上限，
      # 这一步判**相对**上一轮是否显著变坏。一次从 2% 抬到 7% 的回归仍在 8%
      # 上限之内，上限判不出来；两条判据并存，退出码都是 1，报告里写明来源。
      #
      # 基线取快照 ``history`` 的上一轮。R60 重导后 history 有两轮，这一步在
      # 真实快照上判「没有回归」并退出 0（两轮是同批 run，机制验证而非质量
      # 结论；有新 run 的导出后才是真正的两批比较）。
      #
      # 反向验证用全挂快照：它的 history 里上一轮是 0/120 的健康样本，当前
      # 40/120，必须判 1。只跑真实快照会得到一个恒绿步骤——和 R57/R58 一样，
      # 「没红过」不算证据。
      #
      # --regression-margin 3 的依据：入库快照 10/255 的精确界半宽是 2.64 个
      # 百分点，再小会被重导噪声触发；阈值 3.92 + 3 = 6.92% 低于 8% 上限，
      # 回归判据因此能在政策上限之前先开口（R61 校准实算：n=255 时回归先红于
      # k≥26 = 10.20%，政策上限要 k≥29 = 11.37%）。
      - name: Snapshot historical-baseline regression gate
        run: |
          snapshot=tests/fixtures/live_snapshot
          code=0
          python scripts/check_live_snapshot_gate.py --fail-on-regression \
            --regression-margin 3 --data-dir "$snapshot" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::历史基线回归闸门判 $code（1=回归 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit "$code"
          fi
          strict=0
          python scripts/check_live_snapshot_gate.py --fail-on-regression \
            --regression-margin 3 --data-dir tests/fixtures/live_snapshot_exceeds \
            || strict=$?
          if [ "$strict" -ne 1 ]; then
            echo "::error::全挂快照判 $strict（期望 1）：回归判据失去判定力"
            exit 1
          fi
          echo "OK  历史基线回归判据双向生效：真实快照不判回归，全挂快照触发 1"

      # 逐 workflow 历史基线回归（R62）：合并层对「一个 workflow 在变坏、被
      # 其余几个摊薄」是结构性失明的——character 涨到 16/79（20.3%）时全局才
      # 9.41%，95% 下界 6.57% 仍在回归阈值 6.92% 之下，合并层要 18/79 才开口。
      # 这一步在 16/79 就判回归（早 2 次失败），mvp 上早 5 次（15/56 vs 20/56）。
      #
      # 日志里必须能看见「有多少判定力」，否则「没红」会被读成「每个 workflow
      # 都健康」：入库快照上只有 2/9 个 workflow 的基线精度达标（character
      # 2/79、mvp 4/56），其余 7 个判不了；而这 2 个两轮计数完全相同——那说明
      # 的是「没有新增样本」，不是质量结论。脚本把这两句都写进输出。
      #
      # 反向验证与合并层同一形状：全挂快照的 wf-bad 从 0/40 跳到 40/40 必须
      # 判 1。只跑真实快照会得到一个恒绿步骤。
      #
      # margin 10 与 --check-per-workflow 的默认精度余量同一个数：可判集合
      # 因此与「精度达标」的那批完全重合（两处共用 sample_size_margin_needed）。
      - name: Snapshot per-workflow regression gate
        run: |
          snapshot=tests/fixtures/live_snapshot
          code=0
          python scripts/check_live_snapshot_gate.py --check-per-workflow-regression \
            --margin 10 --data-dir "$snapshot" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::逐 workflow 回归闸门判 $code（1=回归 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit "$code"
          fi
          strict=0
          python scripts/check_live_snapshot_gate.py --check-per-workflow-regression \
            --margin 10 --data-dir tests/fixtures/live_snapshot_exceeds \
            || strict=$?
          if [ "$strict" -ne 1 ]; then
            echo "::error::全挂快照判 $strict（期望 1）：逐 workflow 回归判据失去判定力"
            exit 1
          fi
          echo "OK  逐 workflow 回归判据双向生效：真实快照不判回归，全挂快照的 wf-bad 触发 1"

      # 逐 workflow 提前量（R67）：把 R62 §2 的「提前 2 次 / 5 次」变成每次
      # CI 都会复算的一行日志。**这不是一道闸门**——它不作判定，退出 0 只表示
      # 「算出来了」；因此只在 ubuntu 跑一份，两个 runner 的共同覆盖由
      # tests/test_live_snapshot_gate.py 的不变量用例承担。
      # 参数必须与两个真判据同参：--margin 10 = 逐 workflow 层的阈值增量
      # （同时也是基线精度余量）、--regression-margin 3 = 合并层。哪边漂了，
      # 这张表描述的就是另一套判据——由 tests 里的同参用例钉住。
      - name: Snapshot per-workflow lead-time calibration
        run: |
          snapshot=tests/fixtures/live_snapshot
          code=0
          python scripts/check_live_snapshot_gate.py --calibrate-lead-time \
            --margin 10 --regression-margin 3 --data-dir "$snapshot" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::提前量校准算不出来，判 $code（3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit "$code"
          fi
          echo "OK  逐 workflow 提前量已复算（本步不作判定）"

      # 快照样本量（R51）：前三步都在判「这个数字合不合格」，没有一步判
      # 「这个数字的精度够不够当基线」。快照只有 14 次尝试、1 次失败时，实测
      # 7.1% 只是粗估——重导一次就可能变 0% 或 21%，阈值跟着漂。
      #
      # 为什么这一步能进 CI 而 --check-stale / --check-coverage 不能：它**只读
      # 快照自身**，不需要 data/workflows。那两条判据要跟真实数据比，接进 CI
      # 只会永远「无法判定」，是又一个恒绿的防护（R47 §2.3 的教训）。
      #
      # 判据没有写死的样本量常量：有失败时要求失败率 95% 半宽 ≤ margin，零失败
      # 时要求单侧 95% 上界 ≤ margin。所以它判的是精度，不是条数——一次 run 里
      # 50 次尝试不比 5 次 run 共 10 次尝试差。
      - name: Snapshot sample-size gate
        run: |
          snapshot=tests/fixtures/live_snapshot
          # 先验「当前快照该过」——阈值收紧到 2 个百分点时必须红。
          # 只跑前者会得到一个恒绿步骤：0/n 与任何 margin 都能通过。
          code=0
          python scripts/check_live_snapshot_gate.py --check-sample-size \
            --data-dir "$snapshot" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::快照样本量不足（退出码 $code，7=样本太薄 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit "$code"
          fi
          strict=0
          python scripts/check_live_snapshot_gate.py --check-sample-size \
            --data-dir "$snapshot" --margin 2 > /dev/null 2>&1 || strict=$?
          if [ "$strict" -ne 7 ]; then
            echo "::error::收紧余量到 2 后仍判合格（退出码 $strict，期望 7）：判据失去判定力"
            exit 1
          fi
          echo "OK  样本量判据双向生效：默认余量通过，余量 2 触发 7"

      # per-workflow 样本量（R54）。判据与上一步相反：上一步问「这份快照够不够
      # 厚」，这一步问「单个 workflow 太薄时能不能被看出来」。它**不**因为薄而
      # 失败——真实快照里 5 个 workflow 物理上补不到 margin=10，做成硬门槛就是
      # 一个恒红步骤。这一步能红的唯一路径是 per-workflow 元数据与内容不一致，
      # 所以反向验证注入一处漂移，必须判 4。
      - name: Snapshot per-workflow sample-size report
        run: |
          python scripts/check_live_snapshot_gate.py --check-per-workflow \
            --data-dir tests/fixtures/live_snapshot
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::per-workflow 判据失败（退出码 $code，4=元数据漂移 3=无样本 8=判据算术失败·未判定）"
            exit "$code"
          fi
          # 反向验证：把一处 per-workflow 失败数改错，全局合计不变，必须判 4。
          # 用单行 python -c 而不是 heredoc：heredoc 体必须顶格，会提前终止
          # YAML 块标量，整份 workflow 变成非法 YAML。
          tmp=$(mktemp -d)
          cp -r tests/fixtures/live_snapshot/. "$tmp/"
          python -c "import json,pathlib,sys;r=pathlib.Path(sys.argv[1]);m=json.loads((r/'snapshot-meta.json').read_text(encoding='utf-8'));pw=m['per_workflow'];k=sorted(pw)[0];pw[k]['failed']=int(pw[k].get('failed',0))+1;(r/'snapshot-meta.json').write_text(json.dumps(m),encoding='utf-8')" "$tmp" \
            || { echo "::error::无法构造漂移样本"; rm -rf "$tmp"; exit 1; }
          drift=0
          python scripts/check_live_snapshot_gate.py --check-per-workflow \
            --data-dir "$tmp" > /dev/null 2>&1 || drift=$?
          rm -rf "$tmp"
          if [ "$drift" -ne 4 ]; then
            echo "::error::注入 per-workflow 漂移后仍判 $drift（期望 4）：判据失去判定力"
            exit 1
          fi
          echo "OK  per-workflow 判据双向生效：真实快照通过，注入漂移触发 4"

      # per-workflow 失败率（R56；R58 升级为硬门槛）。上一步判的是「单个
      # workflow 的样本够不够厚」，这一步判的是另一个问题：**某个 workflow 的
      # 失效率是否高于其余 workflow 的合并基线**。此前闸门用全局合计当基线，
      # 而全局合计对这个问题是结构性失明的——一个全挂的 workflow 会把自己也
      # 拉进基线，观测值和阈值一起涨。这一步用留一法基线（把被判的那份扣掉）。
      #
      # R56 先跑了一轮报告模式；R57 修完主闸门的自指阈值后，R58 按用户拍定接上
      # 硬门槛（--fail-on-exceeds）。真实快照当下 0 个超出、8 个样本不足，所以
      # 这一步仍然绿——下面两条反向验证证明它不是恒绿：
      #
      # - 全挂快照（tests/fixtures/live_snapshot_exceeds）必须判 1；
      # - 注入 per-workflow 漂移必须判 4。
      #
      # 「样本不足」在任何模式下都不判失败（R56 §2）：把它做成失败，红的是
      # 「样本太薄」而冒充「有 workflow 在变坏」，是向错方向的假红。它的次级
      # 信号（连续 3 轮样本不足 → 提示重导）在报告文字里，不影响退出码。
      - name: Snapshot per-workflow failure-rate gate
        run: |
          snapshot=tests/fixtures/live_snapshot
          python scripts/check_live_snapshot_gate.py --check-per-workflow-rate \
            --fail-on-exceeds --data-dir "$snapshot"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::per-workflow 失败率闸门判 $code（1=有 workflow 超出基线 4=元数据漂移 3=无样本 8=判据算术失败·未判定）"
            exit "$code"
          fi
          # 反向验证 1：判定力。一份「一个 workflow 全挂、其余健康」的合成快照
          # 必须判 1——真实快照当下 0 个超出，只跑它证明不了这一步能红。
          strict=0
          python scripts/check_live_snapshot_gate.py --check-per-workflow-rate \
            --fail-on-exceeds --data-dir tests/fixtures/live_snapshot_exceeds \
            > /dev/null 2>&1 || strict=$?
          if [ "$strict" -ne 1 ]; then
            echo "::error::全挂快照判 $strict（期望 1）：硬门槛失去判定力"
            exit 1
          fi
          # 反向验证 2：判据本身活着——注入漂移必须判 4。
          # 单行 python -c 而非 heredoc：heredoc 体顶格会提前终止 YAML 块标量。
          tmp=$(mktemp -d)
          cp -r "$snapshot"/. "$tmp/"
          python -c "import json,pathlib,sys;r=pathlib.Path(sys.argv[1]);m=json.loads((r/'snapshot-meta.json').read_text(encoding='utf-8'));pw=m['per_workflow'];k=sorted(pw)[0];pw[k]['failed']=int(pw[k].get('failed',0))+1;(r/'snapshot-meta.json').write_text(json.dumps(m),encoding='utf-8')" "$tmp" \
            || { echo "::error::无法构造漂移样本"; rm -rf "$tmp"; exit 1; }
          drift=0
          python scripts/check_live_snapshot_gate.py --check-per-workflow-rate \
            --fail-on-exceeds --data-dir "$tmp" > /dev/null 2>&1 || drift=$?
          rm -rf "$tmp"
          if [ "$drift" -ne 4 ]; then
            echo "::error::注入漂移后仍判 $drift（期望 4）：判据失去判定力"
            exit 1
          fi
          echo "OK  per-workflow 失败率硬门槛双向生效：真实快照通过，全挂快照触发 1，注入漂移触发 4"

      # 工作流编排 e2e（R49）：前三轮（R45/R46/R47）反复记录的「最有价值缺口」。
      # 它一直没做，卡的不是工作量而是凭据——真实 e2e 要一家供应商的 key，而 key
      # 不能进 CI（fork PR 拿不到 secrets），也不该为了跑测试烧额度。
      #
      # 桩 provider 把卡点换成两件可控的事：**协议是真的**（真实 HTTP + SSE，
      # 走 ChatOpenAI SDK → LangGraph → 引擎回调的完整链路），**判定是真的**
      # （断言落在节点流转、失败传导、占位符传参上）。它不判模型质量，也不判
      # 供应商健康——那两件事属于人工验收与真实快照闸门。
      #
      # 不引 secrets 是这条路线的前提：加了 secrets 就退回「fork PR 跑不了」。
      # 有 test_ci_e2e_step_takes_no_secrets 反向钉住。
      - name: Workflow orchestration e2e (stub provider)
        # 硬上限：桩是本地进程，正常 3 个场景约 10s。卡住通常是桩没回 SSE 收尾
        # 导致图空转——那种情况该红，而不是把 job 拖到 GHA 的 6 小时上限。
        timeout-minutes: 10
        run: |
          # 退出码语义：0=通过 1=编排行为不符（真 bug） 3=环境无法启动（导入/
          # 端口问题）。两种都让这一步红——**不**把 3 当警告放过：环境起不来
          # 通常意味着 import 链断了，那本身就是回归；把 3 静默成绿，恰恰是
          # R45/R46/R47 反复批评的「永远绿的防护」。区分只体现在提示文案上，
          # 让人一眼看出该往编排语义还是往装配栈排查（见 R49 §8 的取舍记录）。
          code=0
          python scripts/e2e_workflow_stub.py \
            --metrics-json "$RUNNER_TEMP/e2e-metrics.json" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::error::e2e 无法启动（退出码 3）：先看装配栈，不是编排语义"
          elif [ "$code" -ne 0 ]; then
            echo "::error::e2e 编排行为不符（退出码 $code）"
          fi
          exit $code

      # R88：把本次 e2e 的 metrics 交给写回 job。**只在 main 的 push 上传**——
      # PR 不产生历史轮次，也不需要写权限。e2e 环境起不来（退出码 3）时没有
      # metrics：这里只告警，写回 job 会打印「本轮不入库」并正常结束。
      - name: Upload e2e metrics for history writeback
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-metrics
          path: ${{ runner.temp }}/e2e-metrics.json
          if-no-files-found: warn
          retention-days: 1

      - name: e2e retry summary (observability)
        # 重跑频率此前只能 grep 日志（R68 §7-4）。metrics 缺失/损坏时脚本打印
        # 可见说明并退出 0，不让「没有数据」冒充「0 次重跑」。
        if: always()
        run: |
          python scripts/e2e_retry_summary.py "$RUNNER_TEMP/e2e-metrics.json" >> "$GITHUB_STEP_SUMMARY"

      - name: e2e retry trend (history, read-only)
        # R78：跨 run 趋势随被判数据入库（本机显式 record 后提交），CI 只读
        # 校验——不改 permissions（仍是 contents: read）。历史读不懂/计数矛盾
        # 以 4 退出（重录/修文件），没有历史以 3 退出；**不判趋势好坏**，因为
        # 10 个场景下 1 次重跑就是 10 个百分点（R63/R69）。
        if: always()
        run: |
          python scripts/e2e_retry_history.py check \
            --history tests/fixtures/e2e_retry_history/history.json >> "$GITHUB_STEP_SUMMARY"

      - name: e2e metrics precheck for history (read-only, PR only)
        # R92：把「metrics 能否被历史接受」左移到合入前。这条只在 PR 上跑，
        # 且只调 --check-only：不写文件、不提交——写权限仍然只在
        # e2e-history-writeback job。没有 metrics（e2e 环境未启动）时跳过，
        # 与写回 job 的处置一致（那一步已经红过了）。
        if: always() && github.event_name == 'pull_request'
        run: |
          metrics="$RUNNER_TEMP/e2e-metrics.json"
          if [ ! -f "$metrics" ]; then
            echo "没有 $metrics（e2e 环境未启动），跳过预检"
            exit 0
          fi
          python scripts/e2e_retry_history.py record \
            "$metrics" \
            --history tests/fixtures/e2e_retry_history/history.json \
            --run-id "pr-${{ github.event.pull_request.number }}" \
            --check-only

  # R88：CI 回写 e2e 重跑历史。R81 §7 的结论是「不做」（代价表见交接），R85 的
  # 用户拍定改为「做」。落点是一个**独立 job**，不是 backend 里加一步：
  # 写权限（contents: write）只给这个 job，而它**不跑仓库测试**——token 的写入
  # 面与不可信代码的执行面不重叠。backend 的 PR 运行仍只有 contents: read。
  e2e-history-writeback:
    needs: backend
    # 只在 main 的 push 上写；PR 一律跳过。backend 失败也写（e2e 断言失败的
    # 轮次对趋势有价值）；取消，或环境起不来（没有 metrics）时不写。
    if: "always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend.result != 'cancelled'"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # R95：写回 job 改用 API 拉 artifact（scripts/fetch_ci_artifact.py）。
      # 一旦显式声明 permissions，未列出的 scope 就是 none。
      actions: read
    # 串行化：两个并发 push 的写回不能同时改同一个 history.json。
    concurrency:
      group: e2e-history-writeback
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch e2e metrics artifact
        # R95：R94 的边界只剩 actions/download-artifact 的传输本身不能本地
        # 复现。这里改为调用脚本（列表 → 下载 zip → 解压），语义由
        # tests/test_fetch_ci_artifact.py 用假 HTTP 服务驱动。
        #
        # 没有 artifact（e2e 环境未启动）→ 脚本退出 0，下一步打印「本轮不入库」；
        # 真实传输错误（401/403/5xx/坏 zip）→ 退出 1。旧接线的
        # continue-on-error 会把这些错误吞成「没有 metrics」，静默丢掉一轮。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch_ci_artifact.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --artifact e2e-metrics \
            --path "$RUNNER_TEMP/e2e" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --result-json "$RUNNER_TEMP/fetch-result.json"
      - name: Upload fetch result
        # R98：与 summary 共用同一组 reason/detail；失败也上传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-result
          path: ${{ runner.temp }}/fetch-result.json
          if-no-files-found: warn
          retention-days: 1
      - name: Record and write back the e2e round
        # R89：提交/推送的重试循环已从 YAML 搬进 scripts/ci_writeback_history.py。
        # YAML 里的逻辑本地跑不了，测试只能做子串断言——「写了 for attempt in
        # 1 2 3」不等于「被拒之后真的会 rebase 再推」。这里只保留调用；重试
        # 语义由 tests/test_ci_writeback_history.py 用真实 git 仓驱动。
        #
        # run_id 用 github.run_id（不是重试次数）：同一 run 重跑时覆盖同一轮，
        # 而不是把一次运行记成两轮（R78 的「同 id 覆盖」契约）。
        run: |
          python3 scripts/ci_writeback_history.py \
            --metrics "$RUNNER_TEMP/e2e/e2e-metrics.json" \
            --history tests/fixtures/e2e_retry_history/history.json \
            --run-id "ci-${{ github.run_id }}" \
            --commit-message "chore(e2e): record CI run ${{ github.run_id }} [skip ci]" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --result-json "$RUNNER_TEMP/writeback-result.json"
      - name: Upload writeback result
        # R97：机读结果与 summary 共用同一组 reason/detail；失败也上传。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writeback-result
          path: ${{ runner.temp }}/writeback-result.json
          if-no-files-found: warn
          retention-days: 1

  # R101：把 R99 的拒绝/冲突回放接进生产 CI。此前这些场景只由
  # tests/test_replay_ci_writeback.py 在 backend job 里以 pytest 驱动；这个
  # 独立 job 用 scripts/replay_ci_scenarios.py 在真实 checkout 上走三条路径
  # （happy / 被拒一次后重试 / 冲突后重算），并断言退出码、reason、rounds、
  # push_attempts 与关键输出。pytest 覆盖保留，但不再是唯一执行者。
  #
  # R102：历史窗口 40 轮满后 `history[-40:]` 会挤掉最早一轮，rounds 会退化成
  # 恒等式；驱动额外断言 result.last_run_id 等于本轮 run_id（满窗时这是唯一
  # 证据），并用 rounds_clipped 明说轮数计数是否已被裁剪。
  #
  # 只读与隔离：不声明 permissions（继承顶层 contents: read），不跑
  # pytest / e2e / npm / docker，不引 secrets——fork PR 也能跑。写回只发生在
  # replay 的临时沙箱，真实 origin 不会被推。PR 与 push 都跑：合入前就能发现
  # 回放回归，而不是等 main 上的生产写回 job 才暴露。
  # R103：同一套定义跑 ubuntu + windows。Git for Windows 自带 sh，拒绝钩子
  # 与沙箱 git 都能走；`shell: bash` 让两平台的退出码透传写法保持一致。
  # 失败沙箱由驱动断言存在后清理，不在 runner 的临时目录里累积。
  replay-ci-writeback:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    # 四个场景各 1–3 次本地 git 操作，正常 < 2 分钟；卡住通常是沙箱 git 或
    # 拒绝钩子没返回，不应拖到 GHA 的 6 小时上限。
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      # PR 的 checkout 是 detached HEAD，replay 的 `git clone -b main` 需要
      # 一个本地 main 分支；这只改 runner 上的临时工作区，不改提交内容。
      - name: Materialize main for the sandbox clone
        shell: bash
        run: git checkout -B main
      - name: Replay happy, rejected, conflicting and permanently rejected writebacks
        # 退出码语义：0=四场景全符 1=场景断言不符 3=基线不可用（checkout/
        # git/history 问题）。两种非零都让这一步红；3 单独提示排查方向，
        # 不让「环境坏」冒充「回放语义坏」（R49 的同一处置）。
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          code=0
          "$PYTHON" scripts/replay_ci_scenarios.py \
            --repo . \
            --branch main \
            --summary "$GITHUB_STEP_SUMMARY" \
            --result-json "$RUNNER_TEMP/replay-ci-result.json" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::error::replay 无法建立基线（退出码 3）：先看 checkout/git/history，不是回放语义"
          elif [ "$code" -ne 0 ]; then
            echo "::error::replay 场景断言不符（退出码 $code）"
          fi
          exit $code
      - name: Upload replay result
        # 失败也上传：result JSON 里带每个场景的 expected/actual/failure
        # 与被截断的捕获输出，排查不需要翻整份 job 日志。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-ci-result-${{ matrix.os }}
          path: ${{ runner.temp }}/replay-ci-result.json
          if-no-files-found: warn
          retention-days: 1

  # R103：把 `--fetch-api-url` 全链（下载 artifact → 写回）接进生产。独立
  # push-only job：token 与 `actions: read` 只在这里出现，replay 主 job 仍是
  # 零 token、PR 照跑。backend 成功才可能已经有 e2e-metrics artifact。
  # R104：与 replay 主 job 同平台矩阵。下载/解压的路径规则（反斜杠、驱动器
  # 相对路径）只在 Windows 上才走得到；`shell: bash` + `$PYTHON` 让两平台的
  # 退出码透传与解释器名一致，artifact 名带 os 避免两条腿撞名。
  replay-ci-fetch-chain:
    needs: backend
    if: "always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
      # 列 artifact / 下载 zip 需要 actions: read；写权限仍只在写回 job。
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Materialize main for the sandbox clone
        shell: bash
        run: git checkout -B main
      - name: Replay the fetched-artifact writeback chain
        # artifact API 的 run id 是本轮 GitHub run；历史 run id 由驱动生成为
        # replay-ci-fetched-<sha>，两者不能混用（R103）。
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON: ${{ matrix.python }}
        run: |
          code=0
          "$PYTHON" scripts/replay_ci_scenarios.py \
            --repo . \
            --branch main \
            --fetch-api-url https://api.github.com \
            --fetch-run-id "${{ github.run_id }}" \
            --fetch-repo "${{ github.repository }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --result-json "$RUNNER_TEMP/replay-fetch-result.json" || code=$?
          if [ "$code" -eq 3 ]; then
            echo "::error::replay 全链无法建立基线（退出码 3）：先看 checkout/git/history"
          elif [ "$code" -ne 0 ]; then
            echo "::error::replay 全链断言不符（退出码 $code）"
          fi
          exit $code
      - name: Upload replay fetch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-fetch-result-${{ matrix.os }}
          path: ${{ runner.temp }}/replay-fetch-result.json
          if-no-files-found: warn
          retention-days: 1

  # Windows 权威基线（R19）：本机开发环境为 Windows + Python 3.14（venv 3.14.8），
  # 且存在 Windows 专属语义测试（win_names/幻影目录/设备名）。ubuntu job 保留作
  # 快速跨平台信号；本 job 与本机 High-IL 全量跑（docs/PROJECT_INFO.md 测试环境）
  # 平台一致，Windows-only 用例在 CI 上真实执行而不是 skip。
  windows-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling plugins repo (dev layout ../DeterminFlow-Plugins)
        run: git clone --depth 1 https://github.com/zhijianmengrao/xs2-plugins "${{ github.workspace }}/../DeterminFlow-Plugins"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      # 真实失败率闸门（R57）：与 ubuntu 的同名步骤一一对应（政策上限 8% +
      # 反向验证 1%）。上限数字两边必须一致——有测试钉住；漂开就会在两个 runner
      # 上给出互相矛盾的结论，而那种矛盾最难排查。
      #
      # 两个 pwsh 坑同上（见样本量那一步的注释）：故意以 1 退出的那次调用会让
      # $ErrorActionPreference='Stop' 把「判据正常」包成 NativeCommandError，
      # 末尾又会被 GHA 包装器追加的 `exit $LASTEXITCODE` 带出来。所以先降成
      # Continue，末尾显式 exit 0。
      - name: Provider failure-rate gate against real snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $snapshot = "tests/fixtures/live_snapshot"
          python scripts/check_live_snapshot_gate.py --fail-if-above 8 --data-dir $snapshot
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::真实失败率闸门判 $code（1=超 8% 上限 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit $code
          }
          $null = python scripts/check_live_snapshot_gate.py --fail-if-above 1 --data-dir $snapshot 2>&1
          $tight = $LASTEXITCODE
          if ($tight -ne 1) {
            Write-Host "::error::上限压到 1% 后仍判 $tight（期望 1）：闸门没有判定力"
            exit 1
          }
          Write-Host "OK  真实失败率闸门双向生效（Windows/Python 3.14）：8% 上限通过，1% 上限触发 1"
          exit 0

      # 历史基线回归（R59）：与 backend 的同名步骤一一对应（余量 3 + 全挂快照
      # 反向验证）。余量数字两边必须一致——有测试钉住。同样受 pwsh 两个坑约束：
      # 反向验证那次故意以 1 退出，末尾必须显式 exit 0。
      - name: Snapshot historical-baseline regression gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $snapshot = "tests/fixtures/live_snapshot"
          python scripts/check_live_snapshot_gate.py --fail-on-regression --regression-margin 3 --data-dir $snapshot
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::历史基线回归闸门判 $code（1=回归 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit $code
          }
          $null = python scripts/check_live_snapshot_gate.py --fail-on-regression --regression-margin 3 --data-dir tests/fixtures/live_snapshot_exceeds 2>&1
          $strict = $LASTEXITCODE
          if ($strict -ne 1) {
            Write-Host "::error::全挂快照判 $strict（期望 1）：回归判据失去判定力"
            exit 1
          }
          Write-Host "OK  历史基线回归判据双向生效（Windows/Python 3.14）：真实快照不判回归，全挂快照触发 1"
          exit 0

      # 逐 workflow 历史基线回归（R62）：与 backend 的同名步骤一一对应
      # （margin 10 + 全挂快照反向验证），余量数字两边一致——有测试钉住。
      # 同样受 pwsh 两个坑约束：反向验证那次故意以 1 退出，末尾必须显式 exit 0。
      - name: Snapshot per-workflow regression gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $snapshot = "tests/fixtures/live_snapshot"
          python scripts/check_live_snapshot_gate.py --check-per-workflow-regression --margin 10 --data-dir $snapshot
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::逐 workflow 回归闸门判 $code（1=回归 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit $code
          }
          $null = python scripts/check_live_snapshot_gate.py --check-per-workflow-regression --margin 10 --data-dir tests/fixtures/live_snapshot_exceeds 2>&1
          $strict = $LASTEXITCODE
          if ($strict -ne 1) {
            Write-Host "::error::全挂快照判 $strict（期望 1）：逐 workflow 回归判据失去判定力"
            exit 1
          }
          Write-Host "OK  逐 workflow 回归判据双向生效（Windows/Python 3.14）：真实快照不判回归，全挂快照的 wf-bad 触发 1"
          exit 0

      # 快照样本量（R52）：与 backend job 的同名步骤判同一个东西，但跑在
      # Windows runner + Python 3.14 上。R51 只在 ubuntu 的 backend job 接了这一
      # 步，§10-1 把它记成缺口——判据万一隐含了平台假设（路径、浮点格式化、
      # stderr 编码），只在一个 runner 上验证是看不出来的。
      #
      # 同样做双向验证：只跑「默认余量该通过」会得到一个恒绿步骤。收紧到 2 个
      # 百分点必须触发退出码 7，否则判据已经失去判定力而 CI 仍然绿。
      #
      # 这段用 PowerShell 写（windows-latest 的默认 shell），逻辑与 ubuntu 那段
      # 一一对应；语义差异只有「退出码取 $LASTEXITCODE」与「错误标注语法」。
      - name: Snapshot sample-size gate
        shell: pwsh
        run: |
          # 两处 pwsh 特有的坑，都只在 GHA 上显形（本机 PowerShell 5.1 复现不到）：
          #
          # 1. 反向验证那一步**故意**让脚本以 7 退出。pwsh 的非零退出码原生命令在
          #    $ErrorActionPreference='Stop' 下会被包成 NativeCommandError，让这一步
          #    在「判据正常工作」时反而红。所以先降成 Continue：退出码由
          #    $LASTEXITCODE 显式读，错误由 ::error:: 显式发。
          # 2. GHA 的 pwsh 包装器在脚本末尾追加 `exit $LASTEXITCODE`，而最后一条
          #    原生命令正是那次故意以 7 退出的调用——于是全部分支都判对、日志也
          #    打了 OK，步骤仍然红（R52 实测踩到）。所以末尾必须显式 `exit 0`。
          #
          # 真正的失败在上面用 `exit $code` / `exit 1` 提前退出，不受末尾影响。
          $ErrorActionPreference = 'Continue'
          $snapshot = "tests/fixtures/live_snapshot"
          python scripts/check_live_snapshot_gate.py --check-sample-size --data-dir $snapshot
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "::error::快照样本量不足（退出码 $code，7=样本太薄 3=无样本 4=元数据漂移 8=判据算术失败·未判定）"
            exit $code
          }
          $null = python scripts/check_live_snapshot_gate.py --check-sample-size --data-dir $snapshot --margin 2 2>&1
          $strict = $LASTEXITCODE
          if ($strict -ne 7) {
            Write-Host "::error::收紧余量到 2 后仍判合格（退出码 $strict，期望 7）：判据失去判定力"
            exit 1
          }
          Write-Host "OK  样本量判据双向生效（Windows/Python 3.14）：默认余量通过，余量 2 触发 7"

          # per-workflow 样本量（R54）：与 ubuntu 那段一一对应。它**不**因某个
          # workflow 太薄而失败（真实快照里 5 个物理上补不到 margin=10），能红的
          # 唯一路径是 per-workflow 元数据与内容不一致 → 注入一处漂移必须判 4。
          python scripts/check_live_snapshot_gate.py --check-per-workflow --data-dir $snapshot
          $wfCode = $LASTEXITCODE
          if ($wfCode -ne 0) {
            Write-Host "::error::per-workflow 判据失败（退出码 $wfCode，4=元数据漂移 3=无样本 8=判据算术失败·未判定）"
            exit $wfCode
          }
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("wfdrift-" + [guid]::NewGuid().ToString("N"))
          Copy-Item -Recurse -Force $snapshot $tmp
          python -c "import json,pathlib,sys;r=pathlib.Path(sys.argv[1]);m=json.loads((r/'snapshot-meta.json').read_text(encoding='utf-8'));pw=m['per_workflow'];k=sorted(pw)[0];pw[k]['failed']=int(pw[k].get('failed',0))+1;(r/'snapshot-meta.json').write_text(json.dumps(m),encoding='utf-8')" $tmp
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::无法构造漂移样本"
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            exit 1
          }
          $null = python scripts/check_live_snapshot_gate.py --check-per-workflow --data-dir $tmp 2>&1
          $drift = $LASTEXITCODE
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          if ($drift -ne 4) {
            Write-Host "::error::注入 per-workflow 漂移后仍判 $drift（期望 4）：判据失去判定力"
            exit 1
          }
          Write-Host "OK  per-workflow 判据双向生效（Windows/Python 3.14）：真实快照通过，注入漂移触发 4"
          exit 0

      # per-workflow 失败率（R56；R58 硬门槛）：与 ubuntu 那段一一对应（留一法
      # 基线、--fail-on-exceeds、全挂快照必须判 1、注入漂移必须判 4）。单列一个
      # 步骤而不是并进上一步：Ubuntu 与 Windows 的两个 job 各自独立可读，一处
      # 判据一件事，日志里失败点能直接定位。
      #
      # 同样受 pwsh 那两个坑约束（见上一步注释）：非零退出要降 $ErrorActionPreference，
      # 末尾必须显式 exit 0，否则包装器追加的 `exit $LASTEXITCODE` 会把
      # 「全挂快照故意判 1」或「注入漂移故意判 4」那次调用的退出码带出来，
      # 让整步在判据正常时变红。
      - name: Snapshot per-workflow failure-rate gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $snapshot = "tests/fixtures/live_snapshot"
          python scripts/check_live_snapshot_gate.py --check-per-workflow-rate --fail-on-exceeds --data-dir $snapshot
          $rateCode = $LASTEXITCODE
          if ($rateCode -ne 0) {
            Write-Host "::error::per-workflow 失败率闸门判 $rateCode（1=有 workflow 超出基线 4=元数据漂移 3=无样本 8=判据算术失败·未判定）"
            exit $rateCode
          }
          $null = python scripts/check_live_snapshot_gate.py --check-per-workflow-rate --fail-on-exceeds --data-dir tests/fixtures/live_snapshot_exceeds 2>&1
          $rateStrict = $LASTEXITCODE
          if ($rateStrict -ne 1) {
            Write-Host "::error::全挂快照判 $rateStrict（期望 1）：硬门槛失去判定力"
            exit 1
          }
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("wfrater-" + [guid]::NewGuid().ToString("N"))
          Copy-Item -Recurse -Force $snapshot $tmp
          python -c "import json,pathlib,sys;r=pathlib.Path(sys.argv[1]);m=json.loads((r/'snapshot-meta.json').read_text(encoding='utf-8'));pw=m['per_workflow'];k=sorted(pw)[0];pw[k]['failed']=int(pw[k].get('failed',0))+1;(r/'snapshot-meta.json').write_text(json.dumps(m),encoding='utf-8')" $tmp
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::无法构造漂移样本"
            Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
            exit 1
          }
          $null = python scripts/check_live_snapshot_gate.py --check-per-workflow-rate --fail-on-exceeds --data-dir $tmp 2>&1
          $rateDrift = $LASTEXITCODE
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          if ($rateDrift -ne 4) {
            Write-Host "::error::注入漂移后仍判 $rateDrift（期望 4）：判据失去判定力"
            exit 1
          }
          Write-Host "OK  per-workflow 失败率硬门槛双向生效（Windows/Python 3.14）：真实快照通过，全挂快照触发 1，注入漂移触发 4"
          exit 0
      # 存储名只读巡检（R23）：Windows 权威基线跑完后对仓库做一次设备名遗留
      # 体检，防新数据回归。CI 克隆不含运行期 data/，此步主要锚定配置面与
      # 未来可能入库的数据面；本地权威巡检仍以 PROJECT_INFO 维护入口为准。
      - name: Storage name audit (read-only)
        run: python scripts/audit_storage_names.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  # 真实构建面（R44）：container-config 只校验 compose 语法，Dockerfile 的多阶段
  # 构建（web: npm ci + npm run build、backend: pip install -r requirements.lock、
  # gunicorn 启动）此前在 CI 上零覆盖（HANDOVER_ROUND43 §2.2 缺口 1）。本 job 真构建
  # 镜像并起容器验行为：status 契约（process 模式 4/4 Executor ready）、内置前端产物、
  # 镜像自带 HEALTHCHECK healthy、entrypoint 先裁剪再 exec、镜像不含 tests/ 与凭据。
  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: determinflow-core:ci
          cache-from: type=gha,scope=container-build
          cache-to: type=gha,mode=max,scope=container-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 冒烟脚本只用标准库，无需 pip install；退出码 2 明确表示 runner 缺 docker，
      # 与「镜像有问题」的退出码 1 分开。
      - name: Smoke the running image
        run: python scripts/smoke_container.py --image determinflow-core:ci --skip-build --timeout 300 --logs-dir container-logs
      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-build-logs
          path: container-logs/
          if-no-files-found: ignore
          retention-days: 7

