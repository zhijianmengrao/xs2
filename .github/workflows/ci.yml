name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # 7 个测试文件（插件注册/市场/桌面打包/章节删除/story assistant 等）按本地开发
      # 布局读取主仓库旁的 ../DeterminFlow-Plugins（见 tests/ 内 parents[2] 引用），
      # CI 需复现该兄弟布局，否则收集阶段 FileNotFoundError。
      - name: Checkout sibling plugins repo (dev layout ../DeterminFlow-Plugins)
        run: git clone --depth 1 https://github.com/zhijianmengrao/xs2-plugins "${{ github.workspace }}/../DeterminFlow-Plugins"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      # 供应商失败率闸门自检（R46）：R45 把「无样本空转」做成退出码 3，但闸门
      # 本身仍无任何自动使用者（HANDOVER_ROUND45 §2.4）。本步用入库的真实形状
      # fixture 把三种退出码都真实走一遍——证明闸门在 CI 上真的判、且「没判到
      # 东西」会自己发出声音，而不是每步都绿却零样本。
      #
      # 注意判据边界：fixture 是**固定**数据，所以本步保护的是「闸门与脚本行为
      # 不退化」，不是「供应商今天健康」。真实数据的失败率判定需要 run 记录进
      # CI（artifact 聚合或入库数据面），尚未接线（R46 §未做）。
      - name: Provider failure-rate gate self-test (fixture)
        env:
          # fixture 落在 tests/fixtures/run_samples/workflows/，DATA_DIR 指到其
          # 上一层即可让 src.config.WORKFLOWS_DIR 正好命中（src/config.py:21）。
          DETERMINFLOW_DATA_DIR: ${{ github.workspace }}/tests/fixtures/run_samples
        run: |
          run_gate() {
            python scripts/provider_failure_profile.py --limit 100 --require-sample "$@"
          }
          # 断言退出码；不符则带上下文报错（CI 日志里直接看到 gate 的 stderr）
          expect_exit() {
            want=$1; label=$2; errfile=$3; shift 3
            code=0
            "$@" > /dev/null 2> "$errfile" || code=$?
            cat "$errfile"
            if [ "$code" -ne "$want" ]; then
              echo "::error::$label 期望退出码 $want，实际 $code"
              exit 1
            fi
            echo "OK  $label  exit=$code"
          }

          # 基线 60 次尝试 / 7 失败 / 11.67%：阈值 15 应通过
          expect_exit 0 "阈值 15 未超阈" gate-ok.err run_gate --fail-if-above 15 --summary
          # 阈值 1 应触发——证明闸门不是恒真
          expect_exit 1 "阈值 1 触发闸门" gate-breach.err run_gate --fail-if-above 1 --summary
          # 空数据 + --require-sample 应为 3——证明「闸门没生效」会显式失败
          mkdir -p empty-data/workflows
          expect_exit 3 "无样本时闸门显式失败" gate-nosample.err \
            env DETERMINFLOW_DATA_DIR="$PWD/empty-data" \
            python scripts/provider_failure_profile.py --limit 100 --require-sample \
            --fail-if-above 15 --summary

  # Windows 权威基线（R19）：本机开发环境为 Windows + Python 3.14（venv 3.14.8），
  # 且存在 Windows 专属语义测试（win_names/幻影目录/设备名）。ubuntu job 保留作
  # 快速跨平台信号；本 job 与本机 High-IL 全量跑（docs/PROJECT_INFO.md 测试环境）
  # 平台一致，Windows-only 用例在 CI 上真实执行而不是 skip。
  windows-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling plugins repo (dev layout ../DeterminFlow-Plugins)
        run: git clone --depth 1 https://github.com/zhijianmengrao/xs2-plugins "${{ github.workspace }}/../DeterminFlow-Plugins"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q
      # 存储名只读巡检（R23）：Windows 权威基线跑完后对仓库做一次设备名遗留
      # 体检，防新数据回归。CI 克隆不含运行期 data/，此步主要锚定配置面与
      # 未来可能入库的数据面；本地权威巡检仍以 PROJECT_INFO 维护入口为准。
      - name: Storage name audit (read-only)
        run: python scripts/audit_storage_names.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  # 真实构建面（R44）：container-config 只校验 compose 语法，Dockerfile 的多阶段
  # 构建（web: npm ci + npm run build、backend: pip install -r requirements.lock、
  # gunicorn 启动）此前在 CI 上零覆盖（HANDOVER_ROUND43 §2.2 缺口 1）。本 job 真构建
  # 镜像并起容器验行为：status 契约（process 模式 4/4 Executor ready）、内置前端产物、
  # 镜像自带 HEALTHCHECK healthy、entrypoint 先裁剪再 exec、镜像不含 tests/ 与凭据。
  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: determinflow-core:ci
          cache-from: type=gha,scope=container-build
          cache-to: type=gha,mode=max,scope=container-build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 冒烟脚本只用标准库，无需 pip install；退出码 2 明确表示 runner 缺 docker，
      # 与「镜像有问题」的退出码 1 分开。
      - name: Smoke the running image
        run: python scripts/smoke_container.py --image determinflow-core:ci --skip-build --timeout 300 --logs-dir container-logs
      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-build-logs
          path: container-logs/
          if-no-files-found: ignore
          retention-days: 7

