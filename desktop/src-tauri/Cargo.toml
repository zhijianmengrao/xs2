[package]
name = "determinflow-desktop"
version = "1.0.2"
description = "DeterminFlow desktop shell"
authors = ["DeterminFlow Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# futures-util / reqwest / semver 曾服务于已移除的 R2+Gitee 多源并发探测
# （join3 + semver 比对 + 自建 HTTP 请求）。v1.0.2 单源化后全仓零引用（R42
# 逐文件核实），移除后 tauri-plugin-updater 自身仍会引入所需传递依赖。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
